site_name: 성제한 · Vision Perception Engineer
site_description: 포트폴리오와 논문 리뷰
site_url: https://jaehanjaehan.github.io/research-blog/

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 소개: index.md
  - 포트폴리오:
      - 개요: portfolio/index.md
      - "슬라이드 (한국어)": portfolio/ko/index.md
      - "Slides (English)": portfolio/en/index.md
  - 논문 리뷰:
      - "FAST-Calib: LiDAR-Camera Extrinsic Calibration in One Second": posts/fast-calib-review.md
  - 기술 조사:
      - "NVIDIA Isaac ROS NITROS: 득실과 실제 제약 정리": posts/nitros-review.md
      - "ROS2 노드 컴포지션: 개념과 실제 성능 임팩트": posts/ros2-composition.md
